[workspace]

resolver = "2"

members = ["aoc", "aoc-cli", "intcode"]

[workspace.dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
itertools = "0.15.0"
nom = "8.0.0"
num = "0.4.3"
pest = "2.9.5"
pest_derive = "2.9.5"
rand = "0.10.3"
rayon = "1.12.0"
regex = "1.13.1"
strum = { version = "0.28.0", features = ["strum_macros", "derive"] }
thiserror = "2.0.21"

